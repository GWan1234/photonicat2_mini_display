stages:
  - lint
  - test
  - build
  - package

# NOTE: this project's CI runs on a *shell* executor (runner "cicd-shell"), not
# Docker. Docker `image:` directives are therefore ignored, and the toolchain is
# pre-installed on the runner host instead of pulled per-job:
#   - Go 1.25.x          -> /usr/local/go (symlinked into /usr/local/bin)
#   - aarch64 glibc gcc  -> aarch64-linux-gnu-gcc  (apt: gcc-aarch64-linux-gnu)
#   - aarch64 musl gcc   -> aarch64-linux-musl-gcc (musl.cc, /usr/local/...)
# Keep that host in sync if GO_VERSION changes here.
variables:
  GO_VERSION: "1.25.11"   # informational; Go is provided by the runner host
  GOPROXY: "https://proxy.golang.org,direct"
  GOSUMDB: "sum.golang.org"
  CGO_ENABLED: "1"

# Shared setup for Go jobs. No apt-get / image pulls: the shell runner already
# has the toolchain. `go.work`-free module download only.
.go-template: &go_template
  before_script:
    - go version
    - go mod download

# The tests/ directory is a separate `package main` that references unexported
# symbols from the root package, so it cannot compile as its own package and is
# excluded from vet/test. The real unit tests live in the root package
# (*_test.go alongside the sources). Remove this filter once tests/ is fixed or
# dropped.
# (defined per-job as: PKGS=$(go list ./... | grep -v '/tests$'))

# Lint stage
lint:
  <<: *go_template
  stage: lint
  script:
    - PKGS=$(go list ./... | grep -v '/tests$')
    # gofmt drift is reported but non-fatal (matches the previous `go fmt`
    # behavior, which rewrote in place and never failed the build). go vet is
    # the real gate.
    - 'echo "gofmt drift (informational):"; gofmt -l $(git ls-files "*.go" | grep -v "^tests/") || true'
    - go vet $PKGS
  only:
    - merge_requests
    - main
    - develop

# Test stage
test:
  <<: *go_template
  stage: test
  script:
    - PKGS=$(go list ./... | grep -v '/tests$')
    - go test -v $PKGS
    - go test -race -short $PKGS
  only:
    - merge_requests
    - main
    - develop

# Build for host system
build:host:
  <<: *go_template
  stage: build
  script:
    - make build
  artifacts:
    paths:
      - pcat2_mini_display
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - tags

# Cross-compilation build job. Uses the cross toolchains pre-installed on the
# runner host (see top-of-file note) — no per-job downloads.
build:cross-compile:
  stage: build
  before_script:
    - go version
    - go mod download
  script:
    - echo "Building for OpenWRT (aarch64, musl static)..."
    - GOOS=linux GOARCH=arm64 CGO_ENABLED=1 CC=aarch64-linux-musl-gcc go build -o pcat2_mini_display_openwrt .
    - echo "Building for Debian (aarch64, glibc)..."
    - GOOS=linux GOARCH=arm64 CGO_ENABLED=1 CC=aarch64-linux-gnu-gcc go build -o pcat2_mini_display_debian .
  artifacts:
    paths:
      - pcat2_mini_display_openwrt
      - pcat2_mini_display_debian
    expire_in: 1 week
  only:
    - main
    - tags

# Package stage - create release package
package:
  stage: package
  dependencies:
    - build:cross-compile
  script:
    - |
      # Get version information
      GIT_VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "unknown")
      echo "Packaging version: $GIT_VERSION"

      # Create package directory
      PACKAGE_DIR="pcat2_mini_display_package"
      rm -rf "$PACKAGE_DIR"
      mkdir -p "$PACKAGE_DIR"

      # Copy files to package
      echo "Git version: $GIT_VERSION" > "$PACKAGE_DIR/VERSION.txt"
      cp pcat2_mini_display_openwrt "$PACKAGE_DIR/" || echo "OpenWRT binary not found"
      cp pcat2_mini_display_debian "$PACKAGE_DIR/" || echo "Debian binary not found"
      cp config.json "$PACKAGE_DIR/" || echo "config.json not found"
      cp -r assets "$PACKAGE_DIR/" 2>/dev/null || echo "assets directory not found"
      cp -r service-files "$PACKAGE_DIR/" 2>/dev/null || echo "service-files directory not found"
      cp install_service.sh "$PACKAGE_DIR/" 2>/dev/null || echo "install_service.sh not found"
      cp README.md "$PACKAGE_DIR/" 2>/dev/null || echo "README.md not found"

      # Create tarball
      TAR_NAME="pcat2_mini_display_package_${CI_COMMIT_SHORT_SHA}_${GIT_VERSION}.tar.xz"
      tar -cJf "$TAR_NAME" "$PACKAGE_DIR"
      echo "Created package: $TAR_NAME"

      # List contents
      echo "Package contents:"
      tar -tJf "$TAR_NAME"
  artifacts:
    paths:
      - pcat2_mini_display_package_*.tar.xz
    expire_in: 4 weeks
  only:
    - main
    - tags

# Release job - only for tags
release:
  stage: package
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  dependencies:
    - package
  script:
    - echo "Creating release for tag $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: 'Release $CI_COMMIT_TAG'
    assets:
      links:
        - name: 'Release Package'
          url: '$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/download?job=package'
  only:
    - tags
